[package]
name = "selfish-gene"
version = "0.1.0"
edition = "2021"
authors = ["Vikman Fernandez-Castro <vmfdez90@gmail.com>"]
description = "A high-performance evolution simulator based on Richard Dawkins' Selfish Gene theory."
repository = "https://github.com/yourusername/selfish-gene"
license = "MIT"
keywords = ["simulation", "evolution", "genetic-algorithm", "rust", "cli"]
categories = ["science", "simulation"]
readme = "README.md"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
signal-hook = "0.3"

[lib]
name = "selfish_gene"
path = "src/lib.rs"

[[bin]]
name = "selfish-gene"
path = "src/main.rs"
